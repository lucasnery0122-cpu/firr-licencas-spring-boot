version: '3.8'
services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@db:1521:xe
      SPRING_DATASOURCE_USERNAME: system
      SPRING_DATASOURCE_PASSWORD: oracle_password

  db:
    image: gvenzl/oracle-xe:18-slim
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle_password